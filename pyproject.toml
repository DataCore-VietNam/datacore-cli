[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datacore-cli"
version = "0.1.0"
description = "Official CLI for DataCore — Vietnamese financial and alternative data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DataCore Vietnam", email = "dev@datacore.vn" }]
keywords = [
    "datacore",
    "cli",
    "financial-data",
    "vietnam",
    "stock-market",
    "vn30",
    "hose",
    "hnx",
    "fintech",
    "data-api",
    "typer",
    "parquet",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "datacore @ git+https://github.com/DataCore-VietNam/datacore-python.git@main",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.0"]

[project.urls]
Homepage = "https://datacore.vn"
Documentation = "https://docs.datacore.vn"
Repository = "https://github.com/DataCore-VietNam/datacore-cli"
Changelog = "https://github.com/DataCore-VietNam/datacore-cli/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/DataCore-VietNam/datacore-cli/issues"

[project.scripts]
datacore = "datacore_cli.main:app"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/datacore_cli"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false
