documentation:
  - changed-files:
    - any-glob-to-any-file: ["**/*.md", "docs/**", "README*"]

ci:
  - changed-files:
    - any-glob-to-any-file: [".github/**"]

tests:
  - changed-files:
    - any-glob-to-any-file: ["tests/**", "**/*_test.*", "**/test_*.*"]

dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - "pyproject.toml"
      - "poetry.lock"
